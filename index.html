<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ripasso">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ripasso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow phone column; a deck is a stack, studying is one big card with four answer buttons under the thumb. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#152033; --muted:#5b6679; --line:#d8dee8;
  --accent:#1d4ed8; --accent-ink:#ffffff; --card-edge:#f2c14e;
  --l0:#9aa4b2; --l1:#d1495b; --l2:#e39b2d; --l3:#3a9d6e; --l4:#2563eb;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#182030; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3445;
  --accent:#7aa2ff; --accent-ink:#0b1220; --card-edge:#d9a93a;
  --l0:#6e7a8c; --l1:#ef6b7b; --l2:#f0b04f; --l3:#52c08b; --l4:#6d9cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#182030; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3445;
  --accent:#7aa2ff; --accent-ink:#0b1220; --card-edge:#d9a93a;
  --l0:#6e7a8c; --l1:#ef6b7b; --l2:#f0b04f; --l3:#52c08b; --l4:#6d9cff; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font-family:var(--display);font-size:1.6rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
.sync{font-size:.75rem;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.sync.err{color:var(--l1)}
.sync.upd{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--l1)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.back{min-height:44px;padding:0 6px 0 0;color:var(--accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.deck{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.deck h2{font-family:var(--display);font-size:1.15rem;margin:0}
.deck .meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.due{color:var(--accent);font-weight:600}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.72rem;color:var(--muted)}
.chip b{font-family:var(--display);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.empty{padding:28px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--display);margin:0;font-size:1.3rem}
.empty p{margin:0;max-width:40ch}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:220px;font-size:.95rem;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.preview{font-size:.85rem;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{width:10px;height:10px;border-radius:50%}
.item .txt{min-width:0;overflow-wrap:anywhere}
.item .txt small{display:block;color:var(--muted)}
.x{min-width:44px;min-height:44px;color:var(--muted);font-size:1.1rem}
.x.armed{color:var(--l1);font-size:.8rem;font-weight:600}
/* study */
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scene{perspective:1200px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s ease,opacity .2s ease}
.scene.dragging{transition:none}
.tag{position:absolute;top:12px;z-index:2;padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface);border:2px solid currentColor;opacity:0;transition:opacity .12s;pointer-events:none}
.tag.left{right:58px;color:var(--l2)}
.tag.right{left:12px;color:var(--accent)}
.scene[data-dir="left"] .tag.left,.scene[data-dir="right"] .tag.right{opacity:1}
.swipehint{font-size:.75rem;color:var(--muted);text-align:center}
.more{position:absolute;top:6px;right:6px;z-index:3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.more:hover,.more[aria-expanded="true"]{background:var(--line);color:var(--ink)}
.menu{position:absolute;top:54px;right:8px;z-index:4;min-width:230px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .18)}
.menu button{text-align:left;padding:12px 14px;min-height:46px;font-weight:500}
.menu button+button{border-top:1px solid var(--line)}
.menu button:hover{background:var(--bg)}
.menu .warn{color:var(--l1);font-weight:600}
.item.off .txt{opacity:.5}
.item.off .txt small::after{content:" · ausgeblendet"}
.show{min-height:44px;padding:0 10px;color:var(--accent);font-weight:600;font-size:.85rem}
/* study screen: progress on top, card centred, answer buttons on the bottom edge */
#app.studying{box-sizing:border-box;padding-block:8px 14px;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#app.studying #view{flex:1;min-height:0}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0}
.mid .card{min-height:min(48vh,420px)}
.bottom{display:flex;flex-direction:column;gap:8px}
.card{position:relative;width:100%;min-height:300px;border:0;padding:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 22px;text-align:center;background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--card-edge);border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box}
.face.back{transform:rotateY(180deg)}
.face .word{font-family:var(--display);font-size:clamp(1.6rem,7vw,2.3rem);font-weight:600;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.face .hint{font-size:.8rem;color:var(--muted)}
.face .lang{position:absolute;top:14px;left:18px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--c)}
.rate small{font-weight:500;font-size:.7rem;color:var(--muted)}
.rate:disabled{opacity:.35}
.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.result div{padding:12px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--c);font-size:.75rem;color:var(--muted)}
.result b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink)}
.kbd{font-size:.75rem;color:var(--muted);text-align:center}
@media (hover:none){.kbd{display:none}}
@media (prefers-reduced-motion:reduce){.card,.progress span,.scene{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <button class="back" id="back" hidden>‹ Zurück</button>
    <h1 id="title">Ripasso</h1>
    <span class="sync" id="sync">auf diesem Gerät</span>
  </header>
  <main id="view" class="stack"></main>
</div>

<script>
(() => {
const VERSION = "5";
const DAY = 86400000;
const INTERVALS = [0, 1, 2, 4, 8, 16, 32]; // days until next review, per box
const LEVELS = [
  { name: "Neu",       color: "var(--l0)" },
  { name: "Unsicher",  color: "var(--l1)" },
  { name: "Lernend",   color: "var(--l2)" },
  { name: "Gut",       color: "var(--l3)" },
  { name: "Sicher",    color: "var(--l4)" },
];
const RATES = [
  { name: "Gar nicht", sub: "gleich nochmal", color: "var(--l1)" },
  { name: "Schwer",    sub: "morgen",         color: "var(--l2)" },
  { name: "Gewusst",   sub: "später",         color: "var(--l3)" },
  { name: "Leicht",    sub: "viel später",    color: "var(--l4)" },
];
const SAMPLE = "Deutschland,la Germania\nItalien,l'Italia\nFrankreich,la Francia\nÖsterreich,l'Austria\nSchweiz,la Svizzera\nSpanien,la Spagna\nWissenschaft,la scienza\nNationalität,la nazionalità\nLand,il Paese\ndeutsch; Deutsche/r,tedesco/-a";

const S = { decks: new Map(), view: "home", deckId: null, session: null, levelSel: new Set(), armed: null, mode: "local" };
const $view = document.getElementById("view");
const $title = document.getElementById("title");
const $back = document.getElementById("back");
const $sync = document.getElementById("sync");

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const level = c => !c.box ? 0 : c.box === 1 ? 1 : c.box === 2 ? 2 : c.box <= 4 ? 3 : 4;
const isDue = (c, now) => !c.box || (c.due || 0) <= now;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sortedDecks = () => [...S.decks.entries()].sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

/* ---------- storage: this device first, GitHub Gist sync on top ---------- */
const LS = "ripasso.v1", LS_DEL = "ripasso.deletedDecks", LS_SYNC = "ripasso.sync";
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
function lsSave() { lsSet(LS, JSON.stringify(Object.fromEntries(S.decks))); lsSet(LS_DEL, JSON.stringify(S.deletedDecks)); }
try { S.decks = new Map(Object.entries(JSON.parse(lsGet(LS) || "{}"))); } catch { S.decks = new Map(); }
try { S.deletedDecks = JSON.parse(lsGet(LS_DEL) || "{}"); } catch { S.deletedDecks = {}; }
function setSync(text, err) { $sync.textContent = text; $sync.classList.toggle("err", !!err); }

/* Change tracking: saveDeck() compares each card with how it looked at the last save and stamps
   what changed with a time `t`. Deleted cards and stacks leave a dated tombstone. The merge
   between devices then keeps the newest version of every single card. */
const cardKey = c => JSON.stringify([c.f, c.b, c.box || 0, c.due || 0, !!c.hidden]);
const metaKey = d => JSON.stringify([d.name, !!d.reverse]);
let shadow = new Map();
function resetShadow() {
  shadow = new Map([...S.decks].map(([id, d]) => [id, { meta: metaKey(d), cards: new Map(d.cards.map(c => [c.id, cardKey(c)])) }]));
}
resetShadow();
function stamp(id) {
  const d = S.decks.get(id), sh = shadow.get(id), now = Date.now();
  if (!d) { if (sh) S.deletedDecks[id] = now; shadow.delete(id); return; }
  if (!sh || sh.meta !== metaKey(d)) d.t = now;
  const seen = new Set();
  for (const c of d.cards) {
    seen.add(c.id);
    if (!sh || sh.cards.get(c.id) !== cardKey(c)) c.t = now;
  }
  if (sh) for (const cid of sh.cards.keys()) if (!seen.has(cid)) (d.deleted ||= {})[cid] = now;
  shadow.set(id, { meta: metaKey(d), cards: new Map(d.cards.map(c => [c.id, cardKey(c)])) });
}
function saveDeck(id) { stamp(id); lsSave(); syncSoon(); }

/* Merge two copies (this device + gist). Same result on every device, whatever the order. */
const newer = (a, b, ta, tb) => ta !== tb ? (ta > tb ? a : b) : (JSON.stringify(a) >= JSON.stringify(b) ? a : b);
function mergeData(loc, rem) {
  const tomb = { ...(loc.deletedDecks || {}) };
  for (const [k, v] of Object.entries(rem.deletedDecks || {})) tomb[k] = Math.max(tomb[k] || 0, v);
  const decks = {};
  for (const id of new Set([...Object.keys(loc.decks || {}), ...Object.keys(rem.decks || {})])) {
    const L = (loc.decks || {})[id], R = (rem.decks || {})[id];
    const base = L && R ? newer(L, R, L.t || 0, R.t || 0) : (L || R);
    const deleted = { ...(L?.deleted || {}) };
    for (const [k, v] of Object.entries(R?.deleted || {})) deleted[k] = Math.max(deleted[k] || 0, v);
    const cards = new Map();
    for (const c of [...(L?.cards || []), ...(R?.cards || [])]) {
      const x = cards.get(c.id);
      cards.set(c.id, x ? newer(x, c, x.t || 0, c.t || 0) : c);
    }
    const list = [...cards.values()].filter(c => !(deleted[c.id] >= (c.t || 0)));
    const lastChange = Math.max(base.t || 0, base.createdAt || 0, ...list.map(c => c.t || 0));
    if (tomb[id] && tomb[id] >= lastChange) continue;
    delete tomb[id];
    decks[id] = { ...base, cards: list, deleted };
  }
  return { decks, deletedDecks: tomb };
}

/* GitHub Gist */
const GIST_FILE = "ripasso-data.json";
let sync = null;
try { sync = JSON.parse(lsGet(LS_SYNC) || "null"); } catch {}
let syncTimer = null, syncing = false, syncAgain = false;
async function gh(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, { cache: "no-store", ...opts,
    headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + sync.token, ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (r.status === 401) throw Object.assign(new Error("Token ungültig oder abgelaufen"), { auth: true });
  if (!r.ok) throw new Error("GitHub antwortet " + r.status);
  return r.json();
}
function payload() { return { app: "ripasso", v: 2, updated: Date.now(), decks: Object.fromEntries(S.decks), deletedDecks: S.deletedDecks }; }
async function readGist() {
  const g = await gh("/gists/" + sync.gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return { decks: {}, deletedDecks: {} };
  const text = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
  return JSON.parse(text || "{}");
}
async function writeGist() {
  await gh("/gists/" + sync.gistId, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(payload()) } } }) });
}
function syncSoon(delay = 3000) {
  if (!sync) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, delay);
}
async function syncNow() {
  if (!sync) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  setSync("sync …");
  try {
    const remote = await readGist();
    const merged = mergeData({ decks: Object.fromEntries(S.decks), deletedDecks: S.deletedDecks }, remote);
    const changedHere = JSON.stringify(merged.decks) !== JSON.stringify(Object.fromEntries(S.decks));
    S.decks = new Map(Object.entries(merged.decks));
    S.deletedDecks = merged.deletedDecks;
    resetShadow();
    lsSave();
    if (JSON.stringify(merged) !== JSON.stringify({ decks: remote.decks || {}, deletedDecks: remote.deletedDecks || {} })) await writeGist();
    sync.last = Date.now();
    lsSet(LS_SYNC, JSON.stringify(sync));
    setSync("synchronisiert");
    if (changedHere && (S.view === "home" || S.view === "deck" || S.view === "backup")) render();
  } catch (e) {
    console.warn(e);
    setSync(e.auth ? "Sync: Token prüfen" : navigator.onLine === false ? "offline, später sync" : "Sync-Fehler", true);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; syncSoon(500); }
  }
}
async function connectGist(token) {
  sync = { token };
  const gists = [];
  for (let page = 1; page <= 5; page++) {
    const batch = await gh(`/gists?per_page=100&page=${page}`);
    gists.push(...batch);
    if (batch.length < 100) break;
  }
  const found = gists.find(g => g.files && g.files[GIST_FILE]);
  if (found) sync.gistId = found.id;
  else {
    const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Ripasso – Karten und Fortschritt (nicht löschen)", public: false, files: { [GIST_FILE]: { content: JSON.stringify(payload()) } } }) });
    sync.gistId = g.id;
  }
  lsSet(LS_SYNC, JSON.stringify(sync));
  await syncNow();
  return !!found;
}
function disconnectGist() { sync = null; clearTimeout(syncTimer); lsDel(LS_SYNC); setSync("auf diesem Gerät"); }
document.addEventListener("visibilitychange", () => {
  if (!sync) return;
  if (document.visibilityState === "visible") syncSoon(300);
  else if (syncTimer) { clearTimeout(syncTimer); syncNow(); } // leaving the app: send pending changes now
});
window.addEventListener("online", () => syncSoon(500));

/* ---------- parsing ---------- */
function parse(text, swap) {
  let ok = [], bad = 0;
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim();
    if (!l) continue;
    let i = l.indexOf("\t");
    if (i < 0) i = l.indexOf(",");
    const a = i < 0 ? "" : l.slice(0, i).trim(), b = i < 0 ? "" : l.slice(i + 1).trim();
    if (!a || !b) { bad++; continue; }
    ok.push(swap ? [b, a] : [a, b]);
  }
  return { ok, bad };
}

/* ---------- views ---------- */
const active = d => d.cards.filter(c => !c.hidden); // cards marked "nicht relevant" never show up
function levelCounts(d) { const n = [0, 0, 0, 0, 0]; active(d).forEach(c => n[level(c)]++); return n; }
function barHTML(n, total) {
  if (!total) return '<div class="bar"></div>';
  return '<div class="bar">' + n.map((v, i) => v ? `<span style="width:${(v / total) * 100}%;background:${LEVELS[i].color}"></span>` : "").join("") + "</div>";
}

function viewHome() {
  $title.textContent = "Ripasso"; $back.hidden = true;
  const decks = sortedDecks();
  const now = Date.now();
  if (!decks.length) {
    return `<div class="empty">
      <h2>Noch keine Stapel</h2>
      <p class="muted">Füge deine Vokabeln als Liste ein, eine Karte pro Zeile: <b>Vorderseite,Rückseite</b>. Oder lade erst den Beispielstapel mit 10 Karten.</p>
      <div class="row" style="width:100%"><button class="btn" data-act="sample">Beispiel laden</button><button class="btn primary" data-act="new">Neuer Stapel</button></div>
      <button class="btn" data-act="backup">Backup laden</button>
    </div>`;
  }
  return decks.map(([id, d]) => {
    const n = levelCounts(d), act = active(d), due = act.filter(c => isDue(c, now)).length, off = d.cards.length - act.length;
    return `<button class="deck" data-act="open" data-id="${id}">
      <h2>${esc(d.name)}</h2>
      ${barHTML(n, act.length)}
      <div class="meta"><span>${act.length} Karten · ${n[4]} sicher${off ? ` · ${off} ausgeblendet` : ""}</span>${due ? `<span class="due">${due} fällig</span>` : "<span>alles erledigt</span>"}</div>
    </button>`;
  }).join("") + `<button class="btn primary block" data-act="new">Neuer Stapel</button><button class="btn block" data-act="backup">${sync ? "Sync &amp; Backup" : "Sync &amp; Backup einrichten"}</button><p class="preview" style="text-align:center;margin:0">Version ${VERSION}</p>`;
}

function viewDeck() {
  const d = S.decks.get(S.deckId);

      <button class="btn primary block" data-act="saveName">Speichern</button>`;
  }
  return `
    ${adding ? `<p class="muted" style="margin:0">Neue Karten für <b>${esc(d.name)}</b>.</p>` : `<label class="label" for="name">Name des Stapels</label><input type="text" id="name" placeholder="z. B. Lektion 1" maxlength="80">`}
    <label class="label" for="txt">Karten, eine pro Zeile</label>

function viewStudy() {
  const s = S.session, d = S.decks.get(s.deckId);
  $title.textContent = d.name; $back.hidden = false;
  if (!s.queue.length) {
    return `<div class="empty"><h2>Runde geschafft</h2><p class="muted">${s.answered} Antworten${s.skipped ? `, ${s.skipped} übersprungen` : ""}${s.hiddenNow ? `, ${s.hiddenNow} ausgeblendet` : ""} in dieser Runde.</p></div>
      <div class="result">${RATES.map((R, i) => `<div style="--c:${R.color}"><b>${s.tally[i]}</b>${R.name}</div>`).join("")}</div>
      <button class="btn primary block" data-act="toDeck">Zurück zum Stapel</button>
      ${s.history.length ? `<button class="btn block" data-act="undo">Letzte Karte zurückholen</button>` : ""}`;
  }
  const c = d.cards.find(x => x.id === s.queue[0]);
  if (!c || c.hidden) { s.queue.shift(); return viewStudy(); }
  const a = d.reverse ? c.b : c.f, b = d.reverse ? c.f : c.b;
  const done = s.total - s.queue.length, pct = s.total ? (done / s.total) * 100 : 0;
  return `
    <div class="stack" style="gap:6px">
      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="count"><span>${done} / ${s.total}</span><span>Stufe: ${LEVELS[level(c)].name}</span></div>
    </div>
    <div class="mid">
    <div class="scene"><span class="tag left">Stufe bleibt</span><span class="tag right">Letzte zurück</span>

      ${s.menu ? `<div class="menu" role="menu"><button class="warn" role="menuitem" data-act="hide">Nicht relevant – ausblenden</button><button role="menuitem" data-act="menuClose">Abbrechen</button></div>` : ""}<button class="card ${s.flipped ? "flipped" : ""}" data-act="flip" aria-label="Karte umdrehen">
      <div class="face front"><span class="lang">Frage</span><div class="word">${esc(a)}</div><div class="hint">Tippen zum Umdrehen</div></div>
      <div class="face back"><span class="lang">Antwort</span><div class="word">${esc(b)}</div><div class="hint">${esc(a)}</div></div>
    </button></div>
    <div class="swipehint">← wischen: Stufe bleibt · wischen →: letzte Karte zurück</div>
    </div>
    <div class="bottom">
    <div class="rates">${RATES.map((R, i) => `<button class="rate" style="--c:${R.color}" data-act="rate" data-r="${i}">${R.name}<small>${R.sub}</small></button>`).join("")}</div>
    <div class="kbd">Leertaste: umdrehen · 1–4: bewerten · ←/→: wie wischen</div>
    </div>`;
}

function viewBackup() {
  $title.textContent = "Sync & Backup"; $back.hidden = false;
  const when = sync && sync.last ? new Date(sync.last).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "noch nie";
  const syncBox = sync ? `
    <div class="stack">

      <div class="row"><button class="btn primary" data-act="syncNow">Jetzt synchronisieren</button><button class="btn" data-act="syncOff">${S.armed === "syncOff" ? "Wirklich trennen?" : "Trennen"}</button></div>
    </div>` : `
    <div class="stack">
      <div class="label">GitHub-Sync</div>
      <p style="margin:0">Sichere Karten und Fortschritt automatisch in deinem GitHub-Konto. Auf einem neuen Gerät verbindest du dich einfach wieder und alles ist zurück.</p>
      <ol class="muted" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
        <li>Öffne <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Ripasso" target="_blank" rel="noopener">github.com/settings/tokens/new</a> (Häkchen bei <b>gist</b> ist schon gesetzt).</li>
        <li>Bei „Expiration" am besten <b>No expiration</b> wählen, dann unten auf <b>Generate token</b>.</li>
        <li>Den Token (beginnt mit <code>ghp_</code>) kopieren und hier einfügen.</li>
      </ol>
      <input type="password" id="token" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false">

  return `${syncBox}

    <p class="muted" style="margin:0">Deine Karten und dein Fortschritt liegen auf diesem Gerät${sync ? " und in deinem GitHub" : ""}. Mit einem Backup kannst du sie zusätzlich sichern oder übertragen.</p>
    <div class="row"><button class="btn primary" data-act="bkCopy" ${S.decks.size ? "" : "disabled"}>Backup kopieren</button><button class="btn" data-act="bkFile" ${S.decks.size ? "" : "disabled"}>Als Datei speichern</button></div>
    <label class="label" for="bk">Backup einfügen</label>
    <textarea id="bk" placeholder="Backup-Text hier einfügen" spellcheck="false" autocapitalize="off"></textarea>
    <label class="check"><input type="checkbox" id="bkReplace"> Vorhandene Stapel ersetzen (sonst werden sie ergänzt)</label>
    <div class="preview" id="bkMsg"></div>

function render() {
  if ((S.view === "deck" || S.view === "add" || S.view === "rename") && !S.decks.has(S.deckId)) S.view = "home";
  if (S.view === "study" && (!S.session || !S.decks.has(S.session.deckId))) S.view = "home";
  document.getElementById("app").classList.toggle("studying", S.view === "study" && !!S.session && S.session.queue.length > 0);
  $view.innerHTML = S.view === "home" ? viewHome() : S.view === "deck" ? viewDeck() : S.view === "study" ? viewStudy() : S.view === "backup" ? viewBackup() : viewImport();
  const txt = document.getElementById("txt");
  if (txt) {
    const upd = () => { const p = parse(txt.value, document.getElementById("swap").checked); document.getElementById("pv").textContent = txt.value.trim() ? `${p.ok.length} Karten erkannt` + (p.bad ? `, ${p.bad} Zeilen ohne Komma oder Tab werden übersprungen` : "") + (p.ok[0] ? `. Erste Karte: ${p.ok[0][0]} → ${p.ok[0][1]}` : "") : "Format: Vorderseite,Rückseite. Getrennt wird beim ersten Komma oder Tab."; };
    txt.addEventListener("input", upd); document.getElementById("swap").addEventListener("change", upd);
  }
}

function go(view, deckId) { S.view = view; if (deckId !== undefined) S.deckId = deckId; S.armed = null; render(); window.scrollTo(0, 0); }

function createDeck(name, pairs) {
  const id = uid();
  S.decks.set(id, { name: name || "Neuer Stapel", createdAt: Date.now(), reverse: false, cards: pairs.map(([f, b]) => ({ id: uid(), f, b, box: 0, due: 0 })) });
  saveDeck(id);
  return id;
}

function startStudy(mode) {
  const d = S.decks.get(S.deckId), now = Date.now();
  let cards = active(d);
  if (mode === "due") cards = cards.filter(c => isDue(c, now));
  else if (mode === "levels") cards = cards.filter(c => S.levelSel.has(level(c)));
  if (!cards.length) return;
  const queue = shuffle(cards.map(c => c.id));
  S.session = { deckId: S.deckId, queue, total: queue.length, flipped: false, tally: [0, 0, 0, 0], answered: 0, skipped: 0, history: [] };
  go("study");
}

function rate(r) {
  const s = S.session, d = S.decks.get(s.deckId);
  const c = d.cards.find(x => x.id === s.queue[0]);
  if (c) snapshot(s, c);
  s.queue.shift();
  if (c) {
    const now = Date.now();
    if (r === 0) { c.box = 1; c.due = now; s.queue.splice(Math.min(s.queue.length, 3), 0, c.id); s.total++; }
    else if (r === 1) { c.box = Math.max(1, (c.box || 1) - 1); c.due = now + DAY; }
    else { c.box = Math.min(6, (c.box || 0) + (r === 3 ? 2 : 1)); c.due = now + INTERVALS[c.box] * DAY; }
    s.tally[r]++; s.answered++;
    saveDeck(s.deckId);
  }
  s.flipped = false;
  render();
}

/* Remember the session and the card before an answer or skip, so a swipe right can undo it. */
function snapshot(s, c) {
  s.history.push({ id: c.id, box: c.box, due: c.due, hidden: !!c.hidden, queue: s.queue.slice(), total: s.total,
                   tally: s.tally.slice(), answered: s.answered, skipped: s.skipped, hiddenNow: s.hiddenNow || 0 });
  if (s.history.length > 300) s.history.shift();
}

// swipe left: next card, level and due date stay as they are
function skip() {
  const s = S.session, d = S.decks.get(s.deckId);
  const c = d.cards.find(x => x.id === s.queue[0]);
  if (!c) { render(); return; }
  snapshot(s, c);
  s.queue.shift();
  s.skipped++;
  s.flipped = false;
  render();
}

// swipe right: bring back the previous card and undo what happened to it
function back() {
  const s = S.session, h = s.history.pop();
  if (!h) { render(); return; }
  const d = S.decks.get(s.deckId), c = d.cards.find(x => x.id === h.id);
  if (c && (c.box !== h.box || c.due !== h.due || !!c.hidden !== !!h.hidden)) {
    c.box = h.box; c.due = h.due;
    if (h.hidden) c.hidden = true; else delete c.hidden;
    saveDeck(s.deckId);
  }
  Object.assign(s, { queue: h.queue, total: h.total, tally: h.tally, answered: h.answered, skipped: h.skipped,
                     hiddenNow: h.hiddenNow || 0, flipped: false, menu: false });
  render();
}

// "nicht relevant": the card leaves this round and never shows up again (undo: swipe right)
function hideCurrent() {
  const s = S.session, d = S.decks.get(s.deckId);
  const c = d.cards.find(x => x.id === s.queue[0]);
  s.menu = false;
  if (!c) { render(); return; }
  snapshot(s, c);
  c.hidden = true;
  s.queue = s.queue.filter(id => id !== c.id);
  s.hiddenNow = (s.hiddenNow || 0) + 1;
  s.flipped = false;
  saveDeck(s.deckId);
  render();
}

/* ---------- swipe on the card ---------- */
let drag = null, lastSwipe = 0;
$view.addEventListener("pointerdown", e => {
  const scene = e.target.closest(".scene");
  if (!scene || S.view !== "study" || (e.pointerType === "mouse" && e.button !== 0)) return;
  if (e.target.closest(".more, .menu")) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, moved: false, scene };
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // vertical scroll
    if (Math.abs(dx) < 10) return;
    drag.moved = true;
    drag.scene.classList.add("dragging");
    try { drag.scene.setPointerCapture(e.pointerId); } catch {}
  }
  drag.dx = dx;
  const th = Math.min(90, drag.scene.offsetWidth * 0.22);
  drag.scene.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
  drag.scene.dataset.dir = dx < -th ? "left" : dx > th && S.session.history.length ? "right" : "";
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const { dx, moved, scene } = drag;
  drag = null;
  if (!moved) return; // a tap: the click handler flips the card
  lastSwipe = Date.now();
  scene.classList.remove("dragging");
  const th = Math.min(90, scene.offsetWidth * 0.22);
  const dir = cancelled ? 0 : dx < -th ? -1 : dx > th && S.session.history.length ? 1 : 0;
  if (!dir) { scene.style.transform = ""; scene.dataset.dir = ""; return; }
  const done = dir < 0 ? skip : back;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { done(); return; }
  scene.style.transform = `translateX(${dir * 130}%) rotate(${dir * 14}deg)`;
  scene.style.opacity = "0";
  setTimeout(done, 180);
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

/* ---------- events ---------- */
$back.addEventListener("click", () => {
  if (S.view === "deck" || S.view === "new" || S.view === "backup") go("home");
  else go("deck");
});

$view.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, d = S.decks.get(S.deckId);
  switch (act) {
    case "sample": go("deck", createDeck("Beispiel: Länder", parse(SAMPLE).ok)); break;
    case "new": go("new"); break;
    case "backup": go("backup"); break;
    case "bkCopy": {
      const txt = JSON.stringify({ app: "ripasso", v: 1, decks: Object.fromEntries(S.decks) });
      const msg = document.getElementById("bkMsg");
      navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Kopiert. Füge es auf dem anderen Gerät ein, z. B. per Notiz oder Nachricht an dich selbst."; },
        () => { const bk = document.getElementById("bk"); bk.value = txt; bk.select(); msg.textContent = "Kopieren nicht erlaubt. Der Text steht im Feld oben und ist markiert."; });
      break;
    }
    case "bkFile": {
      const blob = new Blob([JSON.stringify({ app: "ripasso", v: 1, decks: Object.fromEntries(S.decks) })], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ripasso-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      break;
    }
    case "bkLoad": {
      const msg = document.getElementById("bkMsg");
      try {
        const data = JSON.parse(document.getElementById("bk").value);
        if (!data || (data.app !== "ripasso" && data.app !== "lessico") || typeof data.decks !== "object") throw 0;
        const before = [...S.decks.keys()];
        if (document.getElementById("bkReplace").checked) S.decks = new Map();
        let n = 0;
        for (const [id, dk] of Object.entries(data.decks)) { if (dk && Array.isArray(dk.cards)) { S.decks.set(id, dk); shadow.delete(id); n++; } }
        for (const id of new Set([...before, ...S.decks.keys()])) stamp(id);
        lsSave(); syncSoon(500); msg.textContent = n + " Stapel geladen."; setTimeout(() => go("home"), 700);
      } catch { msg.textContent = "Das ist kein gültiges Ripasso-Backup."; }
      break;
    }
    case "open": S.levelSel = new Set(); go("deck", el.dataset.id); break;
    case "syncOn": {
      const token = document.getElementById("token").value.trim(), msg = document.getElementById("syncMsg");
      if (!token) { msg.textContent = "Bitte zuerst den Token einfügen."; break; }
      msg.textContent = "Verbinde mit GitHub …"; el.disabled = true;
      connectGist(token).then(found => {
        msg.textContent = found ? "Verbunden. Deine gespeicherten Karten wurden geladen." : "Verbunden. Deine Karten sind jetzt in GitHub gesichert.";
        setTimeout(() => render(), 900);
      }).catch(e => {
        sync = null; lsDel(LS_SYNC); el.disabled = false;
        msg.textContent = e.auth ? "GitHub kennt diesen Token nicht. Prüfe, ob du ihn vollständig kopiert hast." : "Verbindung fehlgeschlagen: " + e.message + ". Bist du online? Hat der Token das Häkchen bei gist?";
      });
      break;
    }
    case "syncNow": syncNow().then(() => S.view === "backup" && render()); break;
    case "syncOff":
      if (S.armed !== "syncOff") { S.armed = "syncOff"; render(); break; }
      S.armed = null; disconnectGist(); render(); break;
    case "lvl": { const l = +el.dataset.l; S.levelSel.has(l) ? S.levelSel.delete(l) : S.levelSel.add(l); render(); break; }
    case "study": startStudy(el.dataset.mode); break;
    case "rev": d.reverse = el.checked; saveDeck(S.deckId); render(); break;
    case "add": go("add"); break;
    case "rename": go("rename"); break;
    case "toDeck": go("deck"); break;
    case "undo": back(); break;
    case "menu": S.session.menu = !S.session.menu; render(); break;
    case "menuClose": S.session.menu = false; render(); break;
    case "hide": hideCurrent(); break;
    case "unhide": { const c = d.cards.find(x => x.id === el.dataset.id); if (c) { delete c.hidden; saveDeck(S.deckId); } render(); break; }
    case "flip": if (Date.now() - lastSwipe < 400) break; if (S.session.menu) { S.session.menu = false; render(); break; } S.session.flipped = !S.session.flipped; el.classList.toggle("flipped", S.session.flipped); break;
    case "rate": rate(+el.dataset.r); break;
    case "delcard": {
      const id = el.dataset.id;
      if (S.armed !== id) { S.armed = id; render(); break; }
      d.cards = d.cards.filter(c => c.id !== id); S.armed = null; saveDeck(S.deckId); render(); break;
    }
    case "reset":
      if (S.armed !== "reset") { S.armed = "reset"; render(); break; }
      d.cards.forEach(c => { c.box = 0; c.due = 0; }); S.armed = null; saveDeck(S.deckId); render(); break;
    case "deldeck":
      if (S.armed !== "deck") { S.armed = "deck"; render(); break; }
      S.decks.delete(S.deckId); saveDeck(S.deckId); go("home"); break;
    case "saveName": {
      const v = document.getElementById("name").value.trim();
      if (v) { d.name = v; saveDeck(S.deckId); }
      go("deck"); break;
    }
    case "saveNew": case "saveAdd": {
      const p = parse(document.getElementById("txt").value, document.getElementById("swap").checked);
      if (!p.ok.length) { document.getElementById("pv").textContent = "Keine Karten erkannt. Jede Zeile braucht ein Komma oder Tab zwischen Vorder- und Rückseite."; break; }
      if (act === "saveNew") go("deck", createDeck(document.getElementById("name").value.trim(), p.ok));
      else { p.ok.forEach(([f, b]) => d.cards.push({ id: uid(), f, b, box: 0, due: 0 })); saveDeck(S.deckId); go("deck"); }
      break;
    }
  }
  if (act !== "delcard" && act !== "reset" && act !== "deldeck" && S.armed && S.view === "deck") { S.armed = null; }
});

document.addEventListener("keydown", e => {
  if (S.view !== "study" || !S.session) return;
  if (e.target.matches && e.target.matches("input,textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); back(); return; }
  if (!S.session.queue.length) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); skip(); return; }
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    S.session.flipped = !S.session.flipped;
    const card = document.querySelector(".card");
    if (card) card.classList.toggle("flipped", S.session.flipped);
  } else if (/^[1-4]$/.test(e.key)) rate(+e.key - 1);
});

render();
if (sync) { setSync("sync …"); syncNow(); }
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    // an iPhone home-screen app resumes instead of reloading, so check for updates whenever it comes back
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(e => console.warn(e));
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    if (S.view === "home" || S.view === "deck") { reloading = true; location.reload(); return; }
    // don't interrupt a study round or a half-typed list: offer the reload instead
    $sync.textContent = "Update bereit – tippen";
    $sync.classList.add("upd");
    $sync.onclick = () => location.reload();
  });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
